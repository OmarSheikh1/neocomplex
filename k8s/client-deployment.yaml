apiVersion: apps/v1
kind: Deployment
metadata:
   name: client-Deployment
spec:
   replicas: 3
   selector:
      matchLabels:
         component: web
   template:
      metadata:
         labels:
            component: web
      spec:
         - name: client
           image: omarsheikh1/multi-client
           ports:
              - conatinerPort: 3000


